# Configuration for the block registry catalog (GitHub Pages).
#
# The recipes themselves are the content: registry/*.toml is mounted as site
# data and rendered by layouts/home.html, so the catalog cannot drift from
# what block actually installs. The JSON Schema is mounted as a static file so
# editors can point at a stable URL.
baseURL = "https://nao1215.github.io/block-registry/"
locale = "en-us"
title = "block-registry"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
timeZone = "UTC"

[params]
tagline = "The blockchain CLIs block can install"
description = "Recipes that tell block how to find and fetch blockchain development tools: 51 CLIs across Bitcoin, Ethereum, Solana, Cosmos, Starknet, Aptos, Cardano and more."
repo = "https://github.com/nao1215/block-registry"

[module]
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "assets"
target = "assets"

# The recipes themselves, mounted as site data so the catalogue is rendered
# from the files block will embed rather than from a second list.
[[module.mounts]]
source = "../registry"
target = "data/registry"

# Published byte-for-byte so an editor can point at a stable schema URL.
[[module.mounts]]
source = "../schema"
target = "static/schema"

# Images served as-is, and mounted again as processable assets so the layouts
# can derive a social card and a favicon at build time.
[[module.mounts]]
source = "../doc/img"
target = "static/img"

[[module.mounts]]
source = "../doc/img"
target = "assets/imgsrc"

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[[menus.main]]
name = "Catalog"
pageRef = "/"
weight = 10

[[menus.main]]
name = "Recipe format"
pageRef = "/recipe"
weight = 20

[[menus.main]]
name = "Adding a tool"
pageRef = "/contributing"
weight = 30

[[menus.main]]
name = "block"
url = "https://nao1215.github.io/block/"
weight = 40

